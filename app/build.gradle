plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gta6tips.beginner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gta6tips.beginner'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so the APK can be sideloaded.
            // Swap in your own keystore before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
